# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'zulu'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build -x checkstyleMain -x test

    - name: Prepare for the release
      run: |
          chmod +x ./prepareRelease.sh
          ./prepareRelease.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}

    - name: Upload Velocity api javadoc
      uses: actions/upload-artifact@v7
      with:
        path: api/build/libs/velocity-api-*-SNAPSHOT-javadoc.jar
        archive: false
    - name: Upload Velocity api
      uses: actions/upload-artifact@v7
      with:
        path: api/build/libs/velocity-api-*-SNAPSHOT.jar
        archive: false
    - name: Upload Velocity native
      uses: actions/upload-artifact@v7
      with:
        path: native/build/libs/velocity-native-*-SNAPSHOT.jar
        archive: false
    - name: Upload Velocity
      uses: actions/upload-artifact@v7
      with:
        path: proxy/build/libs/velocity-proxy-*-SNAPSHOT-all.jar
        archive: false
