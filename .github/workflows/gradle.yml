# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'zulu'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build -x checkstyleMain -x test

    - name: Prepare for the release
      run: gh release delete latest --cleanup-tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Velocity
      uses: softprops/action-gh-release@v2
      with:
        name: "Velocity"
        tag_name: "latest"
        files: "*/build/libs/*.jar"
        token: "${{ secrets.GITHUB_TOKEN }}"
        target_commitish: "${{ github.sha }}"
        generate_release_notes: true
        draft: false
        prerelease: true
